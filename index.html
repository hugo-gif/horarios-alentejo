<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#E65100" />
  <title>Horários do Alentejo</title>
  <meta name="description" content="Consulta de horários de autocarros do Alentejo — pesquisa por origem e destino." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            /* Laranja vivo — identidade Rodoviária do Alentejo */
            brand: {
              50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
              400: '#fb923c', 500: '#f97316', 600: '#E65100', 700: '#c2410c',
              800: '#9a3412', 900: '#7c2d12',
            },
          },
          keyframes: {
            'fade-up': {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
          animation: {
            'fade-up': 'fade-up .28s ease-out both',
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root { color-scheme: light; }

    /* ===== Correção de emergência iOS: desbloquear scroll e toques =====
       Garante que html/body nunca ficam presos (sem position:fixed nem
       overflow:hidden herdados de estados anteriores). */
    html, body {
      overflow-x: hidden;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
      height: auto !important;
      min-height: 100%;
      position: static !important;
    }
    html { -webkit-text-size-adjust: 100%; }

    /* Realce de toque transparente em TODOS os elementos. */
    * { -webkit-tap-highlight-color: transparent; }
    button, a, input, select, textarea, [role="button"] {
      touch-action: manipulation;
    }

    /* ===== Correções iOS/Safari =====
       Elimina o atraso de 300ms e o realce cinzento ao tocar. */
    button, a, [role="button"], input, select, textarea, label,
    .fav-btn, .viagem-toggle, .paragem-opcao, .lista-btn, .mapa-link {
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    /* Elementos interativos mostram sempre o cursor de mão. */
    button, a, [role="button"], .fav-btn, .viagem-toggle,
    .paragem-opcao, .lista-btn, .mapa-link, summary {
      cursor: pointer;
    }
    /* Botões desativados não devem parecer clicáveis. */
    button:disabled, [aria-disabled="true"] { cursor: default; }

    /* ===== Camadas flutuantes: nunca bloquear toques quando fechadas =====
       Os contentores flutuantes (chat, info, modais) usam a classe .hidden
       (display:none). Reforçamos para garantir que, quando ocultos, não
       criam uma "caixa invisível" que intercepta toques. */
    .hidden { display: none !important; }
    #assist-panel:not(.hidden),
    #reporte-modal:not(.hidden),
    #seletor-paragens:not(.hidden) { pointer-events: auto; }
    #assist-panel.hidden,
    #reporte-modal.hidden,
    #seletor-paragens.hidden { pointer-events: none !important; }

    /* Bloqueio de scroll de fundo enquanto um modal está aberto.
       Aplicado ao <html> (nunca ao body com position:fixed, que congela o iOS). */
    html.modal-aberto { overflow: hidden; }

    /* Viagem já partida (só quando a data é hoje).
       Mantém contraste pleno — apenas um leve tom de fundo para distinguir. */
    .viagem-passada { background-color: #f8fafc; }
    .viagem-passada .viagem-hora-partida { color: #475569; }

    /* Próxima partida */
    .viagem-proxima {
      box-shadow: 0 0 0 2px #E65100, 0 14px 34px -16px rgba(230, 81, 0, .6);
    }

    /* Linha vertical da timeline */
    .timeline::before {
      content: '';
      position: absolute;
      left: 1.5rem;
      top: .5rem;
      bottom: .5rem;
      width: 2px;
      background: linear-gradient(to bottom, transparent, #e2e8f0 6%, #e2e8f0 94%, transparent);
    }

    /* Estrela de favorito */
    .fav-btn svg { transition: color 0.3s ease, transform 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    .fav-btn:active svg { transform: scale(.82); }
    .fav-btn.is-fav svg { color: #E65100; fill: #E65100; }

    /* Micro-animação ao guardar/remover (giro + escala) */
    @keyframes fav-pop {
      0%   { transform: scale(1) rotate(0deg); }
      50%  { transform: scale(1.35) rotate(180deg); }
      100% { transform: scale(1) rotate(360deg); }
    }
    .fav-btn.fav-pop svg { animation: fav-pop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    /* Remoção: a estrela "atropela" o cartão, da direita para a esquerda */
    .fav-cartao.fav-remover { pointer-events: none; }
    .fav-cartao.fav-remover .fav-btn { z-index: 30; }
    .fav-cartao.fav-remover .fav-btn svg {
      animation: fav-atropela 0.5s cubic-bezier(0.55, 0.06, 0.68, 0.19) forwards;
    }
    @keyframes fav-atropela {
      0%   { transform: translateX(0) scale(1) rotate(0deg); }
      35%  { transform: translateX(-30%) scale(2.6) rotate(-140deg); }
      100% { transform: translateX(-320%) scale(3.4) rotate(-360deg); }
    }
    /* O cartão colapsa como se tivesse sido varrido */
    .fav-cartao.fav-remover {
      animation: fav-colapsa 0.5s ease-in forwards;
    }
    @keyframes fav-colapsa {
      0%   { opacity: 1; max-height: 400px; }
      55%  { opacity: .35; max-height: 400px; }
      100% { opacity: 0; max-height: 0; margin: 0; padding: 0; overflow: hidden; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }

    /* Assistente: bolhas de mensagem */
    .assist-msg { animation: fade-up .28s ease-out both; }
    .assist-bolha { max-width: 85%; border-radius: 1.25rem; padding: .6rem .85rem; font-size: .875rem; line-height: 1.35; }
    .assist-bolha-bot { background: #fff; color: #0f172a; box-shadow: 0 1px 2px rgba(15,23,42,.06); border-bottom-left-radius: .35rem; }
    .assist-bolha-user { background: #E65100; color: #fff; border-bottom-right-radius: .35rem; }
    .assist-typing span { display: inline-block; width: 6px; height: 6px; margin: 0 1px; border-radius: 9999px; background: #94a3b8; animation: assist-blink 1.2s infinite ease-in-out both; }
    .assist-typing span:nth-child(2) { animation-delay: .2s; }
    .assist-typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes assist-blink { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-2px); } }

    /* Painéis e modais: toques imediatos (sem atraso de 300ms no Safari iOS). */
    #assist-panel, #reporte-modal, #seletor-paragens { touch-action: manipulation; }
    /* Botões flutuantes: garantir que recebem o toque por cima do conteúdo. */
    #assist-btn, #info-btn { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 font-sans antialiased">
  <header class="sticky top-0 z-30 bg-gradient-to-br from-brand-600 to-brand-800 text-white shadow-lg shadow-brand-900/20">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-3.5">
      <div class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-white/15 ring-1 ring-white/25">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 17V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v11" />
          <path d="M4 11h16" />
          <circle cx="7.5" cy="17.5" r="1.5" />
          <circle cx="16.5" cy="17.5" r="1.5" />
          <path d="M6 19.5h12" />
        </svg>
      </div>
      <div class="min-w-0 flex-1">
        <h1 class="truncate text-lg font-extrabold leading-tight tracking-tight">Horários do Alentejo</h1>
        <p class="truncate text-xs text-brand-100/90">Autocarros regionais · origem e destino</p>
      </div>
    </div>

    <!-- Abas: Pesquisa / Guardados -->
    <nav class="mx-auto max-w-3xl px-4" aria-label="Navegação principal">
      <div class="flex gap-1" role="tablist">
        <button type="button" id="tab-pesquisa" role="tab" aria-selected="true" aria-controls="view-pesquisa"
                class="tab-btn relative flex items-center gap-1.5 rounded-t-xl px-4 py-2.5 text-sm font-bold transition">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" />
          </svg>
          Pesquisa
        </button>
        <button type="button" id="tab-guardados" role="tab" aria-selected="false" aria-controls="view-guardados"
                class="tab-btn relative flex items-center gap-1.5 rounded-t-xl px-4 py-2.5 text-sm font-bold transition">
          <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3Z" />
          </svg>
          Guardados
          <span id="fav-count" class="hidden rounded-full bg-brand-600 px-1.5 py-0.5 text-[10px] font-extrabold leading-none text-white">0</span>
        </button>
      </div>
    </nav>
  </header>

  <main class="mx-auto max-w-3xl px-4 pb-24 pt-5">
    <!-- ============ VISTA: PESQUISA ============ -->
    <div id="view-pesquisa" role="tabpanel" aria-labelledby="tab-pesquisa">
      <section class="rounded-3xl bg-white p-4 shadow-sm ring-1 ring-slate-200/70 sm:p-5">
      <form id="search-form" class="space-y-3" autocomplete="off" novalidate>
        <div>
          <label for="origem" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Origem</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-brand-600" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
            </span>
            <input id="origem" type="text" list="stops-list" inputmode="search"
                   placeholder="Ex.: Beja, Évora, Portalegre…"
                   class="w-full rounded-2xl border border-slate-300 bg-slate-50 py-3 pl-10 pr-12 text-base font-medium text-slate-900 outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/15" />
            <button type="button" id="btn-lista-origem" data-lista="origem"
                    title="Escolher paragem de origem" aria-label="Escolher paragem de origem"
                    class="lista-btn absolute right-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-xl text-slate-500 transition hover:bg-brand-50 hover:text-brand-600 active:scale-95">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" />
                <line x1="3" y1="6" x2="3.01" y2="6" /><line x1="3" y1="12" x2="3.01" y2="12" /><line x1="3" y1="18" x2="3.01" y2="18" />
              </svg>
            </button>
          </div>
        </div>

        <div class="relative flex items-center justify-center">
          <span class="absolute left-0 right-0 h-px bg-slate-100" aria-hidden="true"></span>
          <button type="button" id="btn-swap" title="Inverter rota" aria-label="Inverter origem e destino"
                  class="group relative z-10 flex h-10 w-10 items-center justify-center rounded-full bg-white text-brand-600 shadow ring-1 ring-slate-200 transition hover:bg-brand-50 active:scale-95">
            <svg viewBox="0 0 24 24" class="h-5 w-5 transition-transform duration-300 group-hover:rotate-180" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M8 3 4 7l4 4" />
              <path d="M4 7h16" />
              <path d="M16 21l4-4-4-4" />
              <path d="M20 17H4" />
            </svg>
          </button>
        </div>

        <div>
          <label for="destino" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Destino</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-900" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1v12Z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>
            </span>
            <input id="destino" type="text" list="stops-list" inputmode="search"
                   placeholder="Ex.: Estação Rodoviária, Vila de Frades…"
                   class="w-full rounded-2xl border border-slate-300 bg-slate-50 py-3 pl-10 pr-12 text-base font-medium text-slate-900 outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/15" />
            <button type="button" id="btn-lista-destino" data-lista="destino"
                    title="Escolher paragem de destino" aria-label="Escolher paragem de destino"
                    class="lista-btn absolute right-2 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center rounded-xl text-slate-500 transition hover:bg-brand-50 hover:text-brand-600 active:scale-95">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <line x1="8" y1="6" x2="21" y2="6" /><line x1="8" y1="12" x2="21" y2="12" /><line x1="8" y1="18" x2="21" y2="18" />
                <line x1="3" y1="6" x2="3.01" y2="6" /><line x1="3" y1="12" x2="3.01" y2="12" /><line x1="3" y1="18" x2="3.01" y2="18" />
              </svg>
            </button>
          </div>
        </div>

        <div>
          <label for="data" class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-500">Data da viagem</label>
          <div class="relative">
            <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true">
              <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
            </span>
            <input id="data" type="date"
                     class="w-full rounded-2xl border border-slate-300 bg-slate-50 py-3 pl-10 pr-3 text-base font-medium text-slate-900 outline-none transition focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/15" />
          </div>
          <p id="data-info" class="mt-1.5 text-xs font-medium text-slate-500"></p>
        </div>

        <button type="submit"
                  class="w-full rounded-2xl bg-brand-600 px-4 py-3.5 text-base font-bold text-white shadow-sm transition hover:bg-brand-700 active:scale-[.99] focus:outline-none focus:ring-4 focus:ring-brand-600/25">
            Procurar horários
          </button>
        </form>
      </section>

      <section id="results" class="mt-5"></section>
    </div>

    <!-- ============ VISTA: GUARDADOS ============ -->
    <div id="view-guardados" role="tabpanel" aria-labelledby="tab-guardados" class="hidden">
      <section id="favoritos" class="mt-1"></section>
    </div>
  </main>

  <datalist id="stops-list"></datalist>

  <!-- ============ BOTÃO INFO / REPORTAR ERROS ============ -->
  <button type="button" id="info-btn"
          aria-label="Informações e reportar erros" title="Informações / Reportar erro"
          class="fixed bottom-5 left-5 z-40 flex h-12 w-12 items-center justify-center rounded-full bg-rose-100 text-xl text-rose-600 shadow-lg shadow-rose-900/10 ring-1 ring-rose-200 transition hover:bg-rose-200 hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-rose-300/40">
    <span aria-hidden="true">ℹ️</span>
  </button>

  <!-- ============ MODAL: REPORTAR ERRO ============ -->
  <div id="reporte-modal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="reporte-titulo">
    <div id="reporte-overlay" class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>
    <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[90vh] w-full max-w-lg flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:inset-0 sm:my-auto sm:h-auto sm:rounded-3xl">
      <div class="flex items-center justify-between gap-3 border-b border-slate-100 px-5 py-4">
        <div class="flex items-center gap-2.5">
          <span class="flex h-9 w-9 items-center justify-center rounded-full bg-rose-100 text-lg" aria-hidden="true">ℹ️</span>
          <div>
            <h2 id="reporte-titulo" class="text-base font-bold text-slate-900">Reportar um erro</h2>
            <p class="text-[11px] text-slate-500">Ajuda-nos a melhorar os horários</p>
          </div>
        </div>
        <button type="button" id="reporte-fechar" aria-label="Fechar"
                class="flex h-9 w-9 items-center justify-center rounded-full text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 active:scale-95">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <form id="reporte-form" class="space-y-3 overflow-y-auto px-5 py-4" autocomplete="off" novalidate>
        <div>
          <label for="rep-email" class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Email de contacto</label>
          <input id="rep-email" type="email" placeholder="o.teu@email.pt"
                 class="w-full rounded-2xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm font-medium text-slate-900 outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/15" />
        </div>
        <div>
          <label for="rep-assunto" class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Assunto / Linha</label>
          <input id="rep-assunto" type="text" placeholder="Ex.: Linha Beja → Évora"
                 class="w-full rounded-2xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm font-medium text-slate-900 outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/15" />
        </div>
        <div>
          <label for="rep-mensagem" class="mb-1 block text-xs font-semibold uppercase tracking-wide text-slate-500">Descrição do erro</label>
          <textarea id="rep-mensagem" rows="4" placeholder="Descreve o erro que encontraste…"
                    class="w-full resize-none rounded-2xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm font-medium text-slate-900 outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/15"></textarea>
        </div>
        <p id="rep-erro" class="hidden rounded-xl bg-rose-50 px-3 py-2 text-xs font-semibold text-rose-700 ring-1 ring-rose-200"></p>
        <button type="submit"
                class="w-full rounded-2xl bg-brand-600 px-4 py-3 text-sm font-bold text-white shadow-sm transition hover:bg-brand-700 active:scale-[.99] focus:outline-none focus:ring-4 focus:ring-brand-600/25">
          Enviar Reporte
        </button>
      </form>
    </div>
  </div>

  <!-- ============ ASSISTENTE INTELIGENTE (chat flutuante) ============ -->
  <button type="button" id="assist-btn"
          aria-label="Abrir Assistente de Horários" title="Assistente de Horários"
          class="fixed bottom-5 right-5 z-40 flex h-14 w-14 items-center justify-center rounded-full bg-brand-600 text-2xl text-white shadow-lg shadow-brand-900/30 transition hover:bg-brand-700 hover:scale-105 active:scale-95 focus:outline-none focus:ring-4 focus:ring-brand-600/30">
    <span aria-hidden="true">💬</span>
    <span id="assist-badge" class="absolute -right-0.5 -top-0.5 hidden h-4 w-4 rounded-full bg-emerald-500 ring-2 ring-white"></span>
  </button>

  <div id="assist-panel" class="fixed inset-x-0 bottom-0 z-50 hidden sm:inset-x-auto sm:bottom-24 sm:right-5 sm:w-[380px]" role="dialog" aria-modal="false" aria-labelledby="assist-titulo">
    <div class="flex max-h-[80vh] flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl ring-1 ring-slate-200 sm:max-h-[560px] sm:rounded-3xl">
      <!-- Cabeçalho -->
      <div class="flex items-center gap-3 bg-gradient-to-br from-brand-600 to-brand-800 px-4 py-3.5 text-white">
        <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-full bg-white/15 text-lg" aria-hidden="true">💬</span>
        <div class="min-w-0 flex-1">
          <h2 id="assist-titulo" class="text-sm font-bold leading-tight">Assistente de Horários</h2>
          <p class="text-[11px] text-white/80">Responde em segundos, sem internet</p>
        </div>
        <button type="button" id="assist-fechar" aria-label="Fechar assistente"
                class="flex h-8 w-8 items-center justify-center rounded-full text-white/80 transition hover:bg-white/15 hover:text-white active:scale-95">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" /></svg>
        </button>
      </div>

      <!-- Mensagens -->
      <div id="assist-mensagens" class="flex-1 space-y-3 overflow-y-auto overscroll-contain bg-slate-50 px-4 py-4" aria-live="polite"></div>

      <!-- Sugestões rápidas -->
      <div id="assist-sugestoes" class="flex flex-wrap gap-1.5 border-t border-slate-100 bg-white px-4 pt-3"></div>

      <!-- Entrada -->
      <form id="assist-form" class="flex items-end gap-2 bg-white px-4 pb-4 pt-3" autocomplete="off">
        <textarea id="assist-input" rows="1" placeholder="Ex.: Lisboa para Évora amanhã"
                  class="max-h-28 flex-1 resize-none rounded-2xl border border-slate-300 bg-slate-50 px-3.5 py-2.5 text-sm font-medium text-slate-900 outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/15"></textarea>
        <button type="submit" aria-label="Enviar mensagem"
                class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-brand-600 text-white transition hover:bg-brand-700 active:scale-95 focus:outline-none focus:ring-4 focus:ring-brand-600/25">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z" /><path d="M22 2 11 13" /></svg>
        </button>
      </form>
    </div>
  </div>

  <!-- ============ MODAL: SELETOR DE PARAGENS ============ -->
  <div id="seletor-paragens" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="seletor-titulo">
    <!-- Fundo semi-transparente -->
    <div id="seletor-overlay" class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm"></div>

    <!-- Painel -->
    <div class="absolute inset-x-0 bottom-0 mx-auto flex max-h-[85vh] w-full max-w-lg flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl sm:inset-0 sm:my-auto sm:h-[80vh] sm:rounded-3xl">
      <!-- Cabeçalho -->
      <div class="flex items-center justify-between gap-3 border-b border-slate-100 px-5 py-4">
        <h2 id="seletor-titulo" class="text-base font-bold text-slate-900">Escolher Paragem</h2>
        <button type="button" id="seletor-fechar" aria-label="Fechar"
                class="flex h-9 w-9 items-center justify-center rounded-full text-slate-400 transition hover:bg-slate-100 hover:text-slate-700 active:scale-95">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Pesquisa -->
      <div class="border-b border-slate-100 px-5 py-3">
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" aria-hidden="true">
            <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
          </span>
          <input id="seletor-pesquisa" type="text" inputmode="search" autocomplete="off"
                 placeholder="Pesquisar paragem…"
                 class="w-full rounded-2xl border border-slate-300 bg-slate-50 py-3 pl-10 pr-3 text-base font-medium text-slate-900 outline-none transition placeholder:font-normal placeholder:text-slate-400 focus:border-brand-600 focus:bg-white focus:ring-4 focus:ring-brand-600/15" />
        </div>
      </div>

      <!-- Lista -->
      <div id="seletor-lista" class="flex-1 overflow-y-auto overscroll-contain px-2 py-2"></div>
    </div>
  </div>

  <script src="app.js?v=24"></script>
</body>
</html>
