<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Painel de Administração · Horários do Alentejo</title>
  <meta name="description" content="Painel de administração — gestão de viagens ocultas e manuais." />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            /* Laranja vivo — identidade Rodoviária do Alentejo */
            brand: {
              50: '#fff7ed', 100: '#ffedd5', 200: '#fed7aa', 300: '#fdba74',
              400: '#fb923c', 500: '#f97316', 600: '#E65100', 700: '#c2410c',
              800: '#9a3412', 900: '#7c2d12',
            },
          },
          keyframes: {
            'fade-up': {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
          animation: {
            'fade-up': 'fade-up .28s ease-out both',
          },
        },
      },
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root { color-scheme: light; }
    html { -webkit-text-size-adjust: 100%; }
    body { -webkit-tap-highlight-color: transparent; }

    /* Linha vertical da timeline (rota) */
    .timeline::before {
      content: '';
      position: absolute;
      left: 1.5rem;
      top: .5rem;
      bottom: .5rem;
      width: 2px;
      background: linear-gradient(to bottom, transparent, #e2e8f0 6%, #e2e8f0 94%, transparent);
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-100 font-sans text-slate-900 antialiased">

  <!-- ============ CABEÇALHO ============ -->
  <header class="bg-gradient-to-br from-slate-900 to-slate-800 text-white">
    <div class="mx-auto flex max-w-3xl items-center gap-3 px-4 py-5">
      <span class="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-brand-600 shadow-lg shadow-brand-900/30">
        <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
        </svg>
      </span>
      <div class="min-w-0 flex-1">
        <h1 class="truncate text-lg font-extrabold leading-tight">Painel de Administração</h1>
        <p class="truncate text-xs font-medium text-white/70">Horários do Alentejo · gestão de viagens</p>
      </div>
      <a href="index.html"
         class="flex shrink-0 items-center gap-1.5 rounded-full bg-white/10 px-3 py-2 text-xs font-bold text-white transition hover:bg-white/20">
        <svg viewBox="0 0 24 24" class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6" />
        </svg>
        Voltar à app
      </a>
    </div>
  </header>

  <!-- ============ CONTEÚDO ============ -->
  <main class="mx-auto max-w-3xl px-4 pb-24 pt-5">
    <section id="gestao" class="mt-1"></section>
  </main>

  <datalist id="stops-list"></datalist>

  <script src="admin.js"></script>
</body>
</html>
